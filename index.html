<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDS 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>try { var th0 = localStorage.getItem('pds:theme'); if (th0) document.documentElement.setAttribute('data-theme', th0); } catch (e) {}</script>
<style>
  :root{--ink:#3f3f3f;--line:#cfcfcf;--mint:#bfe5e2;--pink:#f7cdd0;--yellow:#fbeaa6;--blue:#cdd5f3;--sun:#c4384c;--sat:#3a6ea5;--ok:#2e8b57}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e9ec;font-family:'Inter','Noto Sans KR',sans-serif;color:var(--ink)}
  button,select{font-family:inherit;cursor:pointer}
  a{color:inherit}
  html,body{max-width:100%}
  body{overflow-x:clip}
  .wrap{max-width:1320px;margin:0 auto;display:flex;min-height:100vh;background:#fff;overflow-x:clip}
  nav{width:84px;flex:none;padding:10px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;background:#fafafa;border-left:1px solid #d6d6da;border-right:1px solid #dcdce0;box-shadow:-6px 0 14px -10px rgba(0,0,0,.25)}
  nav.open{width:204px}
  nav .ni{border:0;background:transparent;color:#6b6b6b;text-decoration:none;font-family:inherit;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;font-weight:600;cursor:pointer;flex:none}
  nav .ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav .ni:hover{background:#ececec}
  nav .ni.on{background:#fff;color:#3f3f3f;box-shadow:0 0 0 1px #e0e0e0}
  nav .f,nav .nmg{display:none}
  nav .gh{height:1px;background:#e0e0e0;margin:6px 8px}nav .gh span{display:none}
  nav .nsp{flex:1}
  nav .nvt{align-self:flex-end;width:28px;height:28px;border:0;background:transparent;border-radius:8px;color:#8a8a8a;padding:0;margin-bottom:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  nav .nvt:hover{background:#e8e8e8}
  nav .nvt svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  nav.open .nvt svg{transform:rotate(180deg)}
  nav.open .ni{flex-direction:row;gap:10px;padding:8px 10px;font-size:13px;font-weight:600;justify-content:flex-start}
  nav.open .s{display:none}nav.open .f{display:inline}
  nav.open .nfm{display:none}
  nav.open .gh{height:auto;background:none;margin:10px 4px 2px}
  nav.open .gh span{display:block;font-size:11px;color:#8a8a8a;letter-spacing:.5px;font-weight:700}
  nav.open .nmg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:2px 2px}
  nav .nmg a,.nfly a{font-size:12px;font-weight:700;text-align:center;text-decoration:none;color:#6b6b6b;background:#fff;border-radius:6px;padding:5px 0;border:1px solid #e6e6e6}
  nav .nmg a em,.nfly a em{display:none;font-style:normal}
  nav .nmg a.on,.nfly a.on{background:#555;color:#fff;border-color:#555}
  .nfly{display:none;position:fixed;z-index:60;background:#fff;border:1px solid #bdbdbd;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;grid-template-columns:repeat(4,52px);gap:4px}
  .nfly.open{display:grid}
  .nfly a em{display:inline}
  nav.open .nfly{display:none!important}
  .col{flex:1;min-width:0;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}
  #gq{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
  .dd2{position:relative}
  #gq{padding-right:44px}
  #gsb{position:absolute;right:3px;top:3px;bottom:3px;width:38px;border:0;border-radius:7px;background:#555;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
  #gsb:hover{background:#3f3f3f}
  .gw{flex:1;max-width:320px}
  #gbtn{display:none;width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0;align-items:center;justify-content:center}
  #rfb{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0;display:flex;align-items:center;justify-content:center}
  #rfb.spin svg{animation:rfs .8s linear infinite}
  @keyframes rfs{to{transform:rotate(360deg)}}
  #top.sopen #gbtn{background:#555;border-color:#555}
  #top.sopen #gbtn svg{stroke:#fff}
  #rb,#tdb{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;font-weight:700;white-space:nowrap}
  #tdb{background:#555;border-color:#555;color:#fff}
  #tdb:hover{background:#3f3f3f}
  .pm{display:none;position:absolute;top:calc(100% + 6px);left:0;width:min(440px,92vw);max-height:62vh;overflow:auto;background:#fff;border:1px solid #555;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:40}
  .pm.open{display:block}
  .pi{display:block;padding:9px 12px;text-decoration:none;border-bottom:1px solid #eee;font-size:13px}
  .pi:last-child{border-bottom:0}
  .pi:hover,.pi.cur{background:#f4f4f4}
  .pi b{display:block;font-size:11px;color:#6b6b6b;font-weight:700}
  .pi span{font-family:'Gaegu',cursive;font-size:16px;display:block}
  .pi small{color:#8a8a8a;font-size:10px;margin-left:6px}
  .pm .ph{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1px;color:#8a8a8a;background:#fafafa;display:flex;justify-content:space-between}
  .pm .ph button{border:0;background:none;color:#8a8a8a;font-size:10px;text-decoration:underline}
  #ys{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;background:#fff}
  #st{font-size:12px;color:#6b6b6b;min-width:110px}
  #st.err{color:var(--sun)}
  #top .k{margin-left:auto;font-size:11px;color:#8a8a8a}
  @media(min-width:721px){   /* PC 상단 고정 영역: 조금 더 높고 크게 */
    #top{padding:18px 28px;gap:14px;min-height:76px}
    #top #ys,#top #rb{font-size:16px;padding:10px 14px;border-radius:10px}
    #top #gq{font-size:16px;padding:11px 14px;border-radius:10px}
    #top .fsz button{font-size:15px;padding:7px 12px}
    #top .fsz span,#top #st{font-size:14px}
    #top .k{font-size:13px}
  }
  main{padding:24px 28px 120px;min-width:0}
  .title{display:flex;align-items:baseline;gap:10px;margin:12px 0 14px;flex-wrap:wrap}
  .title b{font-size:min(40px,9vw);white-space:nowrap;font-weight:800;line-height:1;letter-spacing:-1px}
  .title span{font-size:13px;color:#6b6b6b;font-weight:700}
  .title em{font-style:normal;font-size:12px;font-weight:700;color:var(--sun)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chips a{font-size:12px;font-weight:700;text-decoration:none;padding:5px 11px;border-radius:999px;background:#eee;color:#555}
  .chips a.on{background:#555;color:#fff}
  .oneline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .oneline .chips{display:contents}
  .lab{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:3px;margin-bottom:4px}
  input,textarea{font-family:'Gaegu','Noto Sans KR',cursive;font-size:18px;color:var(--ink);border:0;border-bottom:1px dashed #cfcfcf;background:transparent;padding:5px 2px;outline:none;width:100%;border-radius:0}
  input:focus,textarea:focus{border-bottom-color:#555;background:#fafafa}
  textarea{resize:vertical;line-height:1.5;border:1px dashed #cfcfcf;padding:8px}
  input.big{font-size:22px;font-weight:700}
  input.yellow{background:var(--yellow);padding:6px 12px;border:0;border-radius:3px}
  input.blue{background:var(--blue);color:#2f3b87;border:0;padding:5px 10px}
  input.small{font-size:15px}
  input.num{width:70px;text-align:center;font-weight:700;display:inline-block}
  .pf{display:flex;align-items:center;gap:6px}
  .pf i{font-style:normal;font-family:'Gaegu',cursive;font-size:18px;color:#8a8a8a;min-width:20px;text-align:center;flex:none}
  .blk{margin-bottom:20px}
  .blk.fold>:first-child{cursor:pointer;user-select:none}
  .blk.fold .lab::after{content:' ▾';font-weight:400}
  .blk.fold.closed .lab::after{content:' ▸'}
  .blk.fold.closed>:not(:first-child){display:none}
  .setall{display:flex;gap:8px;margin:8px 0 12px}
  .setall button{border:1px solid #b5b5b5;background:#fff;border-radius:6px;font-size:12px;padding:4px 12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 36px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 28px}
  .foot{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  .chk{display:flex;align-items:center;gap:8px}
  .st{flex:none;width:24px;height:24px;border:1px solid #8c8c8c;border-radius:5px;background:#fff;padding:0;font-size:14px;font-weight:700;color:#555;line-height:1}
  .st[data-v="✓"],.st[data-seq="h"][data-v="○"]{font-size:0;border-radius:50%;background:var(--ok);border-color:var(--ok)}
  .st[data-v="✓"]::after,.st[data-seq="h"][data-v="○"]::after{content:'✓';font-size:13px;color:#fff}
  .tl-row .tp .st[data-v="✓"]::after{font-size:11px}
  .gdot{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:13px;align-items:center;justify-content:center;font-style:normal}
  .pb.pbl{width:auto;min-width:50px;height:auto;padding:6px 8px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1}
  .pb.pbl small{font-size:10px;font-weight:400;color:#6b6b6b;white-space:nowrap}
  #pop.nw{flex-wrap:nowrap}
  #pop.nw .pb.pbl{flex:1 1 0;min-width:0}
  @media (max-width:420px){#pop.nw{gap:3px;padding:5px}#pop.nw .pb.pbl{padding:6px 2px 5px}#pop.nw .pb.pbl small{font-size:9px}#pop.nw .pb.pbl>span{font-size:16px}}
  .st[data-v="△"],.st[data-v="✕"]{color:var(--sun);border-color:var(--sun)}
  .st[data-v="★"]{color:#c9a100;border-color:#c9a100}
  .dot{width:16px;height:16px;border-radius:50%;border:1px solid #8c8c8c;background:#fff;padding:0}
  .dot.on{background:#3f3f3f}
  .dot.na{background:#e4e4e4;border-color:#d4d4d4}.dot.na.on{background:#3f3f3f;border-color:#3f3f3f}
  .score{margin:16px 0;font-family:'Gaegu',cursive;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
  .score input{border:2px solid var(--sun);border-radius:50%;background:var(--yellow);height:44px;width:80px;text-align:center}
  /* 동적 분류 */
  .cbh{display:flex;align-items:center;gap:4px;margin-bottom:4px}
  .cbn{margin-left:auto;font-size:11px;font-weight:700;color:#6b6b6b;white-space:nowrap}
  .catcard{border:1px solid #e3e3e3;border-top:3px solid var(--cc,#ccc);border-radius:12px;padding:10px 14px 8px;background:#fff;margin-bottom:0}
  .wl .catcard{border:0;border-top:3px solid var(--cc,#ccc);border-radius:0;padding:8px 0 4px;margin-bottom:14px}
  .hero{background:var(--yellow);border-radius:14px;padding:14px 18px 16px;margin:6px 0 4px}
  .hero .hl{display:block;font-size:11px;font-weight:700;letter-spacing:2px;color:#8a6d00;margin-bottom:2px}
  .hero .title{margin:0 0 8px}
  .hero input.yellow{background:rgba(255,255,255,.6);border-radius:8px;padding:8px 12px}
  .foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;border-top:0;padding-top:0}
  .foot .fc{background:#f6f6f6;border-radius:10px;padding:8px 12px}
  .foot .fc b{display:block;font-size:11px;color:#6b6b6b;margin-bottom:2px}
  .foot .fc input{background:transparent}
  .catn{field-sizing:content;min-width:56px;max-width:220px;width:auto;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;border:0;border-radius:3px;padding:3px 10px;color:var(--ink)}
  .catn:focus{outline:2px solid #555;background-image:none}
  .mini{width:18px;height:18px;border-radius:50%;border:1px solid #bbb;background:#fff;padding:0;font-size:11px;line-height:1;color:#777;flex:none}
  .mini.x:hover{color:var(--sun);border-color:var(--sun)}
  .mini[data-armed="1"]{width:auto;padding:0 8px;border-radius:9px;line-height:16px;font-size:11px}
  [data-armed="1"]{background:var(--sun) !important;color:#fff !important;border-color:var(--sun) !important}
  .lnctl{display:inline-flex;gap:4px;margin-top:2px}
  .lnctl button,.addcat{border:1px dashed #b5b5b5;background:#fff;border-radius:6px;font-size:11px;color:#777;padding:2px 8px}
  .lnctl button:hover,.addcat:hover{border-color:#555;color:#333}
  .addcat{padding:6px 12px;margin-top:4px;font-size:12px}
  /* 모양 선택 팝오버 */
  #pop{flex-wrap:wrap;max-width:calc(100vw - 16px);display:none;position:fixed;z-index:30;background:#fff;border:1px solid #555;border-radius:10px;padding:6px;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .pb{width:36px;height:36px;border:1px solid #d6d6d6;border-radius:8px;background:#fff;font-size:18px;font-weight:700;color:#555;padding:0}
  .pb:hover{border-color:#555;background:#f4f4f4}
  .pb[data-pv="✓"]{color:var(--ok)}.pb[data-pv="△"],.pb[data-pv="✕"]{color:var(--sun)}.pb[data-pv="★"]{color:#c9a100}
  .pb.none{font-size:11px;color:#8a8a8a;font-weight:400}
  /* 확인 창 · 휴지통 */
  #md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;align-items:center;justify-content:center;padding:16px}
  .mdb{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .mdb h3{margin:0 0 8px;font-size:16px}
  .mdb p{font-size:13px;line-height:1.65;margin:0 0 16px;color:#444}
  .mda{display:flex;justify-content:flex-end;gap:8px}
  .mda .ebb{min-height:44px;padding:0 18px;font-size:13px}
  .dayfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;gap:10px;flex-wrap:wrap}
  .dayfoot a{color:#6b6b6b}
  .clr{border:1px solid var(--sun);color:var(--sun);background:#fff;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700}
  .clr:hover{background:#fff5f6}
  /* 편집 가능한 색상 범례 */
  .legend.ed{gap:8px 12px}
  .ctabs{display:flex;gap:4px;background:var(--hov,#eee);border-radius:12px;padding:3px;margin:0 0 12px;max-width:420px}
  .ctabs a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:700;padding:9px 6px;border-radius:9px;color:var(--t2,#555)}
  .ctabs a.on{background:var(--ac,#555);color:var(--onac,#fff)}
  .legend.ro{gap:4px 10px;margin:4px 0 8px}
  .lgi.ro{border:0;background:transparent;padding:0;gap:5px;font-size:12px;color:var(--t2,#555)}
  .lgi.ro .lgd{width:10px;height:10px;display:inline-block}
  .legend.ro .addcat{margin:0;padding:2px 10px;font-size:11px}
  .lgi{display:inline-flex;align-items:center;gap:4px;border:1px solid #e3e3e3;border-radius:999px;padding:3px 6px 3px 4px;background:#fff}
  .lgd{width:20px;height:20px;border-radius:50%;border:1px solid #bbb;padding:0;flex:none}
  .lgn{field-sizing:content;min-width:34px;max-width:140px;width:auto;border:0;padding:2px 3px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#444;background:transparent}
  .lgn:focus{outline:2px solid #555;background:#fff}
  .cpb{border-radius:50%;width:34px;height:34px;font-size:10px;font-weight:400;color:#8a8a8a}
  .cpb.sel{outline:2px solid #555;outline-offset:1px}
  /* 홈 */
  h1.big{font-size:clamp(72px,18vw,150px);font-weight:800;letter-spacing:-4px;line-height:1;margin:8px 0 0;color:#444}
  .sub{margin:10px 0 24px;font-size:18px;font-weight:700;letter-spacing:2px;color:#8a8a8a}
  .row{display:flex;justify-content:space-between;align-items:center;height:42px;border:1px solid #8c8c8c;border-radius:8px;padding:0 18px;margin-bottom:10px;text-decoration:none;font-size:14px;font-weight:500}
  .row span:last-child{color:#8a8a8a}
  .hrow{display:flex;align-items:center;gap:12px;margin:14px 0 4px;flex-wrap:wrap}
  .hrow b{font-size:13px;min-width:130px}
  .hint{font-size:11px;color:#7a8a99;margin-top:24px;line-height:1.7}
  /* 달력 */
  .mcal h3{margin:0 0 6px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .mcal h3 a{text-decoration:underline;text-decoration-color:var(--mint);text-decoration-thickness:3px;text-underline-offset:3px}
  @media(min-width:721px){   /* PC 달력: 달마다 카드로 구분하고 날짜 간격을 좁힘 */
    .grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}   /* 한 줄 3칸 폭, 왼쪽 정렬, 카드 간격 좁게 */
    .mcal{background:#fafafa;border:1px solid #c9c9c9;border-radius:12px;padding:14px 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .mcal h3{font-size:15px;border-bottom:1.5px solid #8c8c8c;margin-bottom:8px}
    .mcal .days a{height:38px;line-height:38px;font-size:12px}
  }
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 0;text-align:center;font-size:11px}
  .days .h{font-size:9px;color:#757575}
  .days a{display:block;height:26px;line-height:26px;border-radius:4px;text-decoration:none}
  .sun{color:var(--sun)} .sat{color:var(--sat)}
  .days a.imp{background:var(--c-imp,#f7c1c1)}
  .days a.ann{background:var(--c-ann,#bfe5e2)}
  .days a.imp.ann{background:var(--c-imp,#f7c1c1);box-shadow:inset 0 0 0 2px var(--c-ann,#bfe5e2)}
  .setrow input[type=color],input[type=color]{width:48px;height:36px;min-width:48px;padding:2px;border:1px solid #bdbdbd;border-radius:8px;background:#fff;cursor:pointer;flex:none;display:inline-block;box-sizing:border-box}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
  .setrow input.hexin,input.hexin{width:104px;min-width:104px;flex:none;font-family:ui-monospace,Consolas,monospace;font-size:14px;text-transform:uppercase;border:1px solid #bdbdbd;border-radius:8px;padding:6px 8px;background:#fff;box-sizing:border-box}
  .setrow input.hexin.bad,input.hexin.bad{border-color:var(--sun);background:#fff5f6}
  .ntg{margin-top:8px;border:1px solid #e3e3e3;border-radius:10px;padding:6px 12px;font-size:13px;background:#fafafa}
  .ntg summary{cursor:pointer;font-weight:700;color:#555;padding:4px 0}
  .ntg ol{margin:6px 0 4px;padding-left:20px;line-height:1.6;color:#3f3f3f}
  .ntg code{background:#eee;border-radius:4px;padding:0 5px;font-size:12px}
  .hhd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
  .hhd b{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .hhd span{font-size:13px;font-weight:700;color:#6b6b6b}
  .hcards{column-count:2;column-gap:14px;margin-top:14px}      /* PC: 두 단으로 빈틈 없이 채움 */

  /* ===================== 테마 레이어 (구조·기능은 그대로, 색·글꼴·모서리만) =====================
     A 클린 인디고(기본) · B 웜 페이퍼 · C 다크(밝은 화면을 반전). 설정 → 화면 테마 */
  :root{--pg:#f3f4f7;--surf:#fff;--surf2:#f6f6f9;--hov:#eeeff4;--ln:#e2e4ea;--ln2:#eceef2;--ink:#1d1d22;--t2:#5f6068;--t3:#8b8d96;--ac:#4338ca;--acbg:#eceeff;--onac:#fff;--sun:#d1344b;--sat:#2f63b5;--ok:#1f9d6a;--yellow:#fff1bd;--mint:#cdeee9;--blue:#dde4ff;--line:#e2e4ea;--rad:12px}

  html[data-theme=c] .slots,html[data-theme=c] .catn,html[data-theme=c] .lgd,html[data-theme=c] .swb,html[data-theme=c] #eb .cd,html[data-theme=c] .cpb,html[data-theme=c] .hdot,html[data-theme=c] .cbox,html[data-theme=c] .wkc,html[data-theme=c] .mkchip i,html[data-theme=c] .days a.imp,html[data-theme=c] .days a.ann,html[data-theme=c] .mc.imp,html[data-theme=c] .mc.ann,html[data-theme=c] .mcd.imp,html[data-theme=c] .mcd.ann,html[data-theme=c] input[type=color],html[data-theme=c] .hs,html[data-theme=c] .big3,html[data-theme=c] .hero,html[data-theme=c] .dtt,html[data-theme=c] .wkbar,html[data-theme=c] .cu,html[data-theme=c] .gdot{filter:invert(1) hue-rotate(180deg)}

/* 진단: 아래 본 스크립트가 문법 오류로 못 뜨면, 오류가 난 부분을 화면에 보여 준다 */
window.addEventListener('error', function (ev) {
  if (!/SyntaxError|Invalid or unexpected/.test(String(ev.message || ''))) return;
  try {
    var ss = document.querySelectorAll('script'), txt = '';
    for (var i = 0; i < ss.length; i++) if (ss[i].textContent.length > txt.length) txt = ss[i].textContent;
    var L = txt.split('\n'), cuts = [0];
    for (var j = 1; j < L.length; j++) if (/^(function |async function |const |let |var |document\.|window\.|setTimeout|\/\*|\/\/ )/.test(L[j])) cuts.push(j);
    var bad = -1, msg = '', ok = function (n) { try { new Function(L.slice(0, n).join('\n')); return ''; } catch (e) { return String(e.message); } };
    for (var c = 1; c < cuts.length; c++) { var m = ok(cuts[c]); if (m && !/end of input|Unterminated|missing \)|Unexpected end/i.test(m)) { bad = c; msg = m; break; } }
    var out = '[진단] 스크립트 문법 오류\n' + ev.message + ' (' + ev.lineno + ':' + ev.colno + ')\n';
    if (bad > 0) {
      var s0 = cuts[bad - 1], e0 = cuts[bad];
      out += '오류: ' + msg + '\n본 스크립트 ' + (s0 + 1) + '~' + e0 + '번째 줄 사이에 있습니다. 79번째 글자 근처:\n';
      for (var n = s0; n < e0; n++) {
        var ln = L[n]; if (ln.length < 79) continue;
        var cc = []; for (var k = 74; k < Math.min(ln.length, 86); k++) cc.push(ln.charAt(k) + ':' + ln.charCodeAt(k).toString(16));
        out += (n + 1) + '번째 줄 [' + ln.length + '자] ' + ln.slice(0, 110) + '\n    → ' + cc.join(' ') + '\n';
        if (out.length > 6000) break;
      }
    } else out += '원인 구간을 찾지 못했습니다 (총 ' + L.length + '줄)';
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:60px 12px auto 12px;z-index:99999;background:#fff;border:2px solid #c33;padding:12px;font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-all;max-height:80vh;overflow:auto';
    box.textContent = out; document.body.appendChild(box);
  } catch (x) {}
});
</script>

/* 직접 만든 확인 창 (배포 환경의 iframe 에서는 기본 confirm 이 막힐 수 있음). 기본 포커스는 '취소' */
function confirmBox(title, html, okText) {
  return new Promise(res => {
    const md = $('#md');
    md.innerHTML = `<div class="mdb"><h3 id="mdt">${esc(title)}</h3><p>${html}</p><div class="mda"><button type="button" id="mdn" class="ebb">취소</button><button type="button" id="mdy" class="ebb del">${esc(okText)}</button></div></div>`;
    md.style.display = 'flex';
    const kd = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    const done = v => { md.style.display = 'none'; md.innerHTML = ''; document.removeEventListener('keydown', kd, true); res(v); };
    document.addEventListener('keydown', kd, true);
    $('#mdn').onclick = () => done(false); $('#mdy').onclick = () => done(true);
    md.onclick = e => { if (e.target === md) done(false); };
    $('#mdn').focus();
  });
}

/* ---------- 연간 계획표 ---------- */

      const dt = new Date(YEAR, m, d), k = fmt(dt), dw = dowIdx(dt), n = `y${m + 1}_${d}`;
      const ydd = store['day:' + k], yan = (annIdx(YEAR)[k] || []), ymo = ((store['month:' + k.slice(0, 7)] || {})['n' + d]) || ttlGet(k);
      const ydots = (hasContent(ydd) && dotOn('y') ? '<b class="y"></b>' : '') + (hol(k) && dotOn('r') ? '<b class="r"></b>' : '') + (ymo && dotOn('u') ? '<b class="u"></b>' : '') + (yan.length && dotOn('g') ? '<b class="g"></b>' : '');
      body += `<td class="cbx" style="--bg:${V(n + '_c', 0) ? colorOf('year', V(n + '_c', 0)) : ((store['day:' + k] || {}).imp ? 'var(--c-imp,#f7c1c1)' : 'transparent')}"><div class="ycell ctg"><button type="button" class="yd ${dayCls(k, dw)}" data-c="${n}_c" data-k="${k}" title="${esc(hol(k))}"><span class="ydn">${d} ${DOW1[dw]}</span><span class="dts">${ydots}<span class="cdw" data-cdw="${k}">${mkDots(k)}</span></span></button><input data-link="${k}" value="${esc(ttlGet(k))}" placeholder="${esc(hol(k))}" autocomplete="off"></div></td>`;

    <div class="ytool">칸 너비 <input type="range" id="ycw" min="140" max="420" step="10" value="${cw}" aria-label="칸 너비"><span id="ycwv">${cw}px</span></div>

/* ---------- 달력 ---------- */
const hasContent = o => o && typeof o === 'object' && Object.keys(o).some(f => (Array.isArray(o[f]) ? o[f].length : (typeof o[f] === 'string' && o[f] && !/_c$/.test(f))));
// 일일 기록 한 줄 요약: BIG3 → 타임블록 글 → SEE 순
function sumDay(o) {
  if (!o) return '';
  const t = [o.b1, o.b2, o.b3].filter(Boolean); if (t.length) return t.join(' · ');
  const bl = (o.blocks || []).find(b => b.t); if (bl) return bl.t;
  return o.see0 || o.seeh || '';
}
function cal() {

    const mi = mm - 1, lead = dowIdx(new Date(YEAR, mi, 1)), n = new Date(YEAR, mi + 1, 0).getDate();
    let c = '<div></div>'.repeat(lead);
    for (let d = 1; d <= n; d++) {

      const dd = store['day:' + k], hs = hasContent(dd);
      const an = window.__ai[k] || [];
      c += `<a href="#d${k}" title="${esc([hol(k), ...an, hs ? sumDay(dd) : ''].filter(Boolean).join(' · '))}" class="${dayCls(k, dw)} ${dd && dd.imp ? 'imp' : ''} ${an.length ? 'ann' : ''}">${d}${hs ? '<i class="gd"></i>' : ''}</a>`;
    }

      const k = fmt(d), hn = hol(k), dn = d.getDate(), an = (monthAnn[k] || []).join(' · ');

    }
  }
  const head = Array.from({ length: n }, (_, i) => `<div>${i + 1}</div>`).join('');
  const nT0 = cnt('trk', 1), nP = cnt('plan', 1);
  /* Task Tracker 행: 월간에 적은 항목 + 주간에서 만든 항목(이름이 같으면 하나로) */
  for (let i = 0; i < nT0; i++) if (V('hn' + i) && !V('hs' + i)) { const b = fmt(new Date()).slice(0, 7) === `${YEAR}-${pad(m)}` ? new Date() : first; D.data['hs' + i] = fmt(mondayOf(b)); touch(doc); }
  const trows = Array.from({ length: nT0 }, (_, i) => ({ name: V('hn' + i), own: i })), have = new Set(trows.map(r => r.name).filter(Boolean));
  const wkMon = {}; for (let s = mondayOf(first); s <= last; s = addD(s, 7)) habNames(store['week:' + fmt(s)]).forEach(nm => { if (!(nm in wkMon)) wkMon[nm] = s; if (!have.has(nm)) { have.add(nm); trows.push({ name: nm, own: null }); } });
  trows.sort((a, b) => (b.name ? 1 : 0) - (a.name ? 1 : 0));
  trows.forEach(r => {

  const tcell = (r, d) => {

/* 표시 색상: 색 상자(type=color)와 색상 코드 입력칸이 서로 맞춰진다 */
function colSet(t) {
  const hexMode = !!t.dataset.hex, k = t.dataset.hex || t.dataset.k;
  let v = t.value.trim();
  if (hexMode) {
    if (/^[0-9a-f]{3}$/i.test(v)) v = '#' + v.split('').map(c => c + c).join('');
    else if (/^[0-9a-f]{6}$/i.test(v)) v = '#' + v;
    if (!/^#[0-9a-f]{6}$/i.test(v)) { t.classList.add('bad'); return; }           // 아직 완성되지 않은 코드는 무시
    t.classList.remove('bad');
  }
  v = v.toLowerCase();
  const c = CFG.data; c.col = Object.assign({}, c.col || {}); c.col[k] = v; touch(CFG); applyCols();
  document.querySelectorAll(`[data-act="setcol"][data-k="${k}"]`).forEach(x => { x.value = v; });
  if (!hexMode) document.querySelectorAll(`[data-hex="${k}"]`).forEach(x => { x.value = v; x.classList.remove('bad'); });
}

async function holRefresh(btn) {
  const msg = $('#holmsg');
  if (!hasGas) { if (msg) msg.textContent = '미리보기에서는 쓸 수 없습니다 (배포 후 사용)'; return; }

  const y = YEAR;
  try {
    const list = await api.holidays(y);
    if (!list || !list.length) { holNote = `${y}년 공휴일을 가져오지 못했습니다(캘린더에 아직 없음)`; }
    else {
      const d = CFG.data; d.hol = d.hol || {}; let add = 0, upd = 0;
      list.forEach(([k, n]) => { const cur = holRaw(k); if (cur === n) return; if (cur) upd++; else add++; d.hol[k] = n; });
      const off = new Set(list.map(x => x[0]));
      const extra = Object.keys(Object.assign({}, HOL_B, d.hol)).filter(k => k.slice(0, 4) === String(y) && hol(k) && !off.has(k)).length;
      if (add || upd) touch(CFG);
      holNote = (add || upd ? `갱신 완료: 추가 ${add} · 변경 ${upd}` : '이미 최신입니다') + (extra ? ` · 캘린더에 없는 ${extra}건은 그대로 둠` : '');
    }
  } catch (e) { holNote = '갱신 실패: ' + (e && e.message ? e.message : e); }
  if (YEAR === y && current.split('@')[0] === '#set') route(true);
}
