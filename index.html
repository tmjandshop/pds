<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDS 다이어리</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .ask { max-width: 420px; margin: 20vh auto 0; padding: 0 20px; font: 15px/1.6 system-ui, sans-serif; color: #222; }
  .ask input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; margin: 8px 0; }
  .ask button { padding: 9px 16px; font-size: 14px; }
</style>
</head>
<body>
<script>
(function () {
  var KEY = 'pds:exec', url = '';
  try { if (/[?&]reset\b/.test(location.search)) localStorage.removeItem(KEY); url = localStorage.getItem(KEY) || ''; } catch (e) {}
  function show(u) {
    var f = document.createElement('iframe');
    f.src = u; f.title = 'PDS 다이어리'; f.allow = 'clipboard-read; clipboard-write; geolocation';
    document.body.appendChild(f);
  }
  if (url) { show(url); return; }
  var d = document.createElement('div'); d.className = 'ask';
  d.innerHTML = '<b>앱 주소를 한 번만 입력하세요</b><br>구글 웹 앱의 /exec 로 끝나는 주소입니다. 이 기기의 브라우저에만 저장됩니다.<input id="u" placeholder="https:\/\/script.google.com/macros/s/…/exec" autocomplete="off"><button id="b" type="button">저장하고 열기</button>';
  document.body.appendChild(d);
  document.getElementById('b').onclick = function () {
    var v = document.getElementById('u').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v)) { alert('주소 형식이 맞지 않습니다. /exec 로 끝나는 전체 주소를 넣어 주세요.'); return; }
    try { localStorage.setItem(KEY, v); } catch (e) {}
    location.reload();
  };
})();
</script>
</body>
</html>
